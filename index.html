<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>José Ferrer Picó</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
            font-family: Georgia, "Times New Roman", serif;
        }

        .pantalla {
            width: 100vw;
            height: 100vh;
            background: #111111;
            color: #f2eee8;
            display: flex;
            flex-direction: column;
        }

        /* CABECERA */

.cabecera {
    height: 20vh;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 45px;
    background: #151515;
}

        .nombre {
            font-size: clamp(28px, 2.8vw, 46px);
            font-weight: normal;
            letter-spacing: 2px;
            color: #f2eee8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
.foto-jose {
    display: block;
    width: 140px;
    height: 140px;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
}

        /* ZONA DE FOTOGRAFÍAS */

        .presentacion {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #111111;
        }

        .presentacion img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .presentacion img.visible {
            opacity: 1;
        }

        /* MENSAJE DE CARGA */

        #cargando {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d8d2ca;
            font-size: 24px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="pantalla">

        <header class="cabecera">

            <div class="nombre">
                José Ferrer Picó
            </div>

            <img
                class="foto-jose"
                src="fotos/foto.jpeg"
                alt="José Ferrer Picó"
            >

        </header>

        <main class="presentacion">

            <div id="cargando">
                Cargando fotografías...
            </div>

            <img id="foto1" alt="">
            <img id="foto2" alt="">

        </main>

    </div>

    <script>

        /* ==============================
           CONFIGURACIÓN GOOGLE DRIVE
           ============================== */

        const API_KEY = "AIzaSyD6suEF2ak4JoMcpFBJhhLbF87FL_zyRD4";

        const FOLDER_ID =
            "1Uu7ZvlVQ3yAMQKY5w6bOpyrmrnAJnXL7";


        /* ==============================
           VARIABLES
           ============================== */

        let fotos = [];
        let indice = 0;
        let fotoActual = 1;

        const foto1 =
            document.getElementById("foto1");

        const foto2 =
            document.getElementById("foto2");

        const cargando =
            document.getElementById("cargando");


        /* ==============================
           CARGAR FOTOS DE GOOGLE DRIVE
           ============================== */

        async function cargarFotos() {

            const url =
                "https://www.googleapis.com/drive/v3/files" +
                "?q=" +
                encodeURIComponent(
                    "'" +
                    FOLDER_ID +
                    "' in parents and trashed = false"
                ) +
                "&fields=files(id,name,mimeType)" +
                "&pageSize=100" +
                "&key=" +
                API_KEY;


            try {

                const respuesta =
                    await fetch(url);


                if (!respuesta.ok) {

                    cargando.textContent =
                        "No se han podido cargar las fotografías.";

                    return;
                }


                const datos =
                    await respuesta.json();


                fotos =
                    datos.files.filter(
                        archivo =>
                            archivo.mimeType &&
                            archivo.mimeType.startsWith("image/")
                    );


                if (fotos.length === 0) {

                    cargando.textContent =
                        "No se encontraron fotografías.";

                    return;
                }


                /* Ocultar mensaje */

                cargando.style.display =
                    "none";


                /* Mostrar primera foto */

                mostrarFoto();


                /* Cambiar cada 7 segundos */

                setInterval(
                    mostrarFoto,
                    7000
                );

            }

            catch (error) {

                cargando.textContent =
                    "No se han podido cargar las fotografías.";

                console.error(error);
            }
        }


        /* ==============================
           MOSTRAR FOTOGRAFÍA
           ============================== */

        function mostrarFoto() {

            const archivo =
                fotos[indice];


            const urlFoto =
                "https://drive.google.com/thumbnail?id=" +
                archivo.id +
                "&sz=w1920";


            const siguiente =
                fotoActual === 1
                    ? foto2
                    : foto1;


            const actual =
                fotoActual === 1
                    ? foto1
                    : foto2;


            siguiente.src =
                urlFoto;


            siguiente.onload =
                function() {

                    siguiente.classList.add(
                        "visible"
                    );

                    actual.classList.remove(
                        "visible"
                    );


                    fotoActual =
                        fotoActual === 1
                            ? 2
                            : 1;


                    indice++;


                    if (
                        indice >= fotos.length
                    ) {

                        indice = 0;
                    }
                };
        }


        /* ==============================
           INICIAR
           ============================== */

        cargarFotos();

    </script>

</body>
</html>
