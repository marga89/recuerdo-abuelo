<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Ferrer Picó</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Georgia, "Times New Roman", serif;
            color: white;
        }

        .pantalla {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        /* PARTE SUPERIOR FIJA */
        .cabecera {
            height: 30vh;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 25px 55px;
            background: #151515;
        }

        .nombre {
            font-size: clamp(35px, 4vw, 65px);
            font-weight: normal;
            letter-spacing: 3px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .foto-jose {
            height: 25vh;
            max-height: 230px;
            width: auto;
            max-width: 320px;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        /* PARTE INFERIOR */
        .presentacion {
            position: relative;
            flex: 1;
            overflow: hidden;
            background: #0d0d0d;
        }

        .foto {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .foto.visible {
            opacity: 1;
        }

        .cargando {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="pantalla">

        <!-- CABECERA FIJA -->
        <div class="cabecera">

            <div class="nombre">
                José Ferrer Picó
            </div>

            <img
                class="foto-jose"
                src="fotos/foto.jpeg"
                alt="José Ferrer Picó"
            >

        </div>


        <!-- FOTOS FAMILIARES -->
        <div class="presentacion">

            <div class="cargando" id="cargando">
                Cargando fotografías...
            </div>

            <img id="foto1" class="foto">
            <img id="foto2" class="foto">

        </div>

    </div>


    <script>

        // TU CLAVE DE GOOGLE DRIVE
        const API_KEY = "PEGA_AQUI_TU_CLAVE";

        // Carpeta "Fotos iaio"
        const FOLDER_ID = "1Uu7ZvlVQ3yAMQKY5w6bOpyrmrnAJnXL7";

        let fotos = [];
        let indice = 0;
        let fotoActual = 1;

        const foto1 = document.getElementById("foto1");
        const foto2 = document.getElementById("foto2");
        const cargando = document.getElementById("cargando");


        async function cargarFotos() {

            const url =
                "https://www.googleapis.com/drive/v3/files" +
                "?q=" + encodeURIComponent(
                    "'" + FOLDER_ID + "' in parents and trashed = false"
                ) +
                "&fields=files(id,name,mimeType)" +
                "&pageSize=100" +
                "&key=" + API_KEY;

            try {

                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    cargando.textContent =
                        "No se han podido cargar las fotografías.";
                    return;
                }

                const datos = await respuesta.json();

                fotos = datos.files.filter(
                    archivo =>
                        archivo.mimeType &&
                        archivo.mimeType.startsWith("image/")
                );

                if (fotos.length === 0) {
                    cargando.textContent =
                        "No se encontraron fotografías.";
                    return;
                }

                cargando.style.display = "none";

                mostrarFoto();

                setInterval(mostrarFoto, 7000);

            } catch (error) {

                cargando.textContent =
                    "No se han podido cargar las fotografías.";

                console.error(error);
            }
        }


        function mostrarFoto() {

            const archivo = fotos[indice];

            const urlFoto =
                "https://drive.google.com/thumbnail?id=" +
                archivo.id +
                "&sz=w1920";

            const siguiente =
                fotoActual === 1 ? foto2 : foto1;

            const actual =
                fotoActual === 1 ? foto1 : foto2;

            siguiente.src = urlFoto;

            siguiente.onload = function() {

                siguiente.classList.add("visible");

                actual.classList.remove("visible");

                fotoActual =
                    fotoActual === 1 ? 2 : 1;

                indice++;

                if (indice >= fotos.length) {
                    indice = 0;
                }
            };
        }


        cargarFotos();

    </script>

</body>
</html>
