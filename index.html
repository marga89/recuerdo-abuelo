<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Ferrer Picó</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
            font-family: Georgia, "Times New Roman", serif;
            color: white;
        }

        .pantalla {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .nombre {
            position: absolute;
            top: 35px;
            left: 45px;
            z-index: 10;
            font-size: clamp(28px, 3vw, 55px);
            font-weight: normal;
            letter-spacing: 2px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.7);
        }

        .presentacion {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #111;
        }

        .foto {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .foto.visible {
            opacity: 1;
        }

        .cargando {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ccc;
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="pantalla">

        <div class="nombre">
            José Ferrer Picó
        </div>

        <div class="presentacion">

            <div class="cargando" id="cargando">
                Cargando fotografías...
            </div>

            <img id="foto1" class="foto">
            <img id="foto2" class="foto">

        </div>

    </div>


    <script>

        // TU CLAVE DE GOOGLE DRIVE
        const API_KEY = "AIzaSyD6suEF2ak4JoMcpFBJhhLbF87FL_zyRD4";

        // Carpeta "Fotos iaio"
        const FOLDER_ID = "1Uu7ZvlVQ3yAMQKY5w6bOpyrmrnAJnXL7";

        let fotos = [];
        let indice = 0;
        let fotoActual = 1;

        const foto1 = document.getElementById("foto1");
        const foto2 = document.getElementById("foto2");
        const cargando = document.getElementById("cargando");


        async function cargarFotos() {

            cargando.textContent = "Probando conexión...";

            const url =
                "https://www.googleapis.com/drive/v3/files" +
                "?q=" + encodeURIComponent(
                    "'" + FOLDER_ID + "' in parents and trashed = false"
                ) +
                "&fields=files(id,name,mimeType)" +
                "&pageSize=100" +
                "&key=" + API_KEY;

            try {

                const respuesta = await fetch(url);

                if (!respuesta.ok) {

                    cargando.textContent =
                        "ERROR GOOGLE: " + respuesta.status;

                    return;
                }

                const datos = await respuesta.json();

                fotos = datos.files.filter(
                    archivo =>
                        archivo.mimeType &&
                        archivo.mimeType.startsWith("image/")
                );

                cargando.textContent =
                    "Fotos encontradas: " + fotos.length;

                if (fotos.length === 0) {
                    return;
                }

                setTimeout(() => {

                    cargando.style.display = "none";

                    mostrarFoto();

                    setInterval(mostrarFoto, 7000);

                }, 2000);

            } catch (error) {

                cargando.textContent =
                    "ERROR DE CONEXIÓN";

                console.error(error);
            }
        }


        function mostrarFoto() {

            const archivo = fotos[indice];

            const urlFoto =
                "https://drive.google.com/thumbnail?id=" +
                archivo.id +
                "&sz=w1920";

            const siguiente =
                fotoActual === 1 ? foto2 : foto1;

            const actual =
                fotoActual === 1 ? foto1 : foto2;

            siguiente.src = urlFoto;

            siguiente.onload = function() {

                siguiente.classList.add("visible");

                actual.classList.remove("visible");

                fotoActual =
                    fotoActual === 1 ? 2 : 1;

                indice++;

                if (indice >= fotos.length) {
                    indice = 0;
                }
            };
        }


        cargarFotos();

    </script>

</body>
</html>
